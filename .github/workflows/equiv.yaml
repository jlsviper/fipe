name: equiv

# Formal equivalence of the RTL and an IHP-cell gate netlist (tools/equiv.sh).
# About 20 to 40 minutes, so it runs only when the chip's Verilog changes, or by hand.
on:
  push:
    paths:
      - 'src/**'
  workflow_dispatch:

jobs:
  equiv:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install Yosys
        run: sudo apt-get update && sudo apt-get install -y yosys

      - name: Every output of the gates equals the RTL's
        run: ./tools/equiv.sh
